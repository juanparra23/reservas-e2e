serenity {
    project.name = "Plataforma de Reservas - E2E Screenplay"
    take.screenshots = FOR_EACH_ACTION
    use.unique.browser = false
    restart.browser.for.each = scenario
    test.root = co.com.eap05.certificacion.reservas
    console.colors = true
    logging = VERBOSE
    report {
        accessibility = true
    }
    requirement {
        types = "modulo, caracteristica"
    }
}

reservas.delay = 0
reservas.base.url = "https://reservas-front-eap05.vercel.app/"

webdriver.wait.for.timeout = 15000
webdriver.timeouts.implicitlywait = 5000
headless.mode = false

webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome"
        "goog:chromeOptions" {
            args = ["incognito", "window-size=1440,900"]
        }
    }
}

pages {
    inicio = "https://reservas-front-eap05.vercel.app/"
    registro = "https://reservas-front-eap05.vercel.app/registro/"
    login = "https://reservas-front-eap05.vercel.app/login/"
    reservas = "https://reservas-front-eap05.vercel.app/reservas/"
    servicios = "https://reservas-front-eap05.vercel.app/servicios/"
    horarios = "https://reservas-front-eap05.vercel.app/horarios/"
    eventos = "https://reservas-front-eap05.vercel.app/eventos/"
}

